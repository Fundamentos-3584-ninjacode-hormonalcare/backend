# Spring Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Configuración específica de health indicators
management.health.defaults.enabled=true

# Desactivar la validación estricta de miembros de grupos (para evitar errores si falta algún componente)
management.endpoint.health.validate-group-membership=false

# Definir el orden de los estados de salud (UP tiene prioridad más alta)
management.endpoint.health.status.order=EXTERNAL_SERVICES_DOWN, DOWN, OUT_OF_SERVICE, UNKNOWN, UP

# Crear grupos de indicadores de salud para organizar mejor la información
# Grupo principal - incluye componentes críticos que determinan si la aplicación está UP
management.endpoint.health.group.application.include=diskSpace,db,mongo
management.endpoint.health.group.application.show-details=always
management.endpoint.health.group.application.status.order=DOWN, OUT_OF_SERVICE, UNKNOWN, UP

# Grupo para servicios externos - no afectan el estado general de la aplicación
management.endpoint.health.group.external.include=externalServices
management.endpoint.health.group.external.show-details=always
management.endpoint.health.group.external.status.order=DOWN, OUT_OF_SERVICE, UNKNOWN, UP, EXTERNAL_SERVICES

# Importar configuración de información para Actuator
spring.config.import=classpath:application-info.properties