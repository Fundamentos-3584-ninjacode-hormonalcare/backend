# Spring application name
spring.application.name=hormonal-care-backend

# Datasource (MySQL)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=com.backend.hormonalcare.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCase

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# JWT
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# Supabase
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=hormonalcare-file

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.validate-group-membership=false
management.endpoint.health.status.order=EXTERNAL_SERVICES_DOWN,DOWN,OUT_OF_SERVICE,UNKNOWN,UP
management.endpoint.health.group.application.include=diskSpace,db,mongo
management.endpoint.health.group.application.show-details=always
management.endpoint.health.group.application.status.order=DOWN,OUT_OF_SERVICE,UNKNOWN,UP
management.endpoint.health.group.external.include=externalServices
management.endpoint.health.group.external.show-details=always
management.endpoint.health.group.external.status.order=DOWN,OUT_OF_SERVICE,UNKNOWN,UP,EXTERNAL_SERVICES

# Swagger OpenAPI config
springdoc.swagger-ui.url=https://backend-production-e47e.up.railway.app/v3/api-docs
springdoc.swagger-ui.config-url=https://backend-production-e47e.up.railway.app/v3/api-docs/swagger-config

# Permitir detectar el protocolo original (para HTTPS detrás de proxy)
server.forward-headers-strategy=framework
